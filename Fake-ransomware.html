<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMS // VOID TERMINAL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CRT effect */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.2) 50%),
                linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
    background-size: 100% 4px, 3px 100%;
    pointer-events: none;
}

.container {
    width: 90%;
    max-width: 1100px;
    height: 85vh;
    border: 1px solid #222;
    display: grid;
    grid-template-columns: 300px 1fr;
    background: rgba(10,10,10,0.95);
}

/* SIDEBAR */
.sidebar {
    border-right: 1px solid #222;
    padding: 30px;
    text-align: center;
}

.brand {
    font-size: 42px;
    letter-spacing: 10px;
    margin-top: 20px;
}

.sub {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

/* SVG LOGO F-SOCIETY (no image file needed) */
.logo {
    margin: auto;
    width: 140px;
    margin-top: 20px;
}

.status {
    margin-top: 40px;
    text-align: left;
    font-size: 13px;
    color: #aaa;
}

.status div {
    margin-bottom: 10px;
}

/* MAIN */
.main {
    padding: 40px;
}

.title {
    font-size: 48px;
    letter-spacing: 3px;
}

.subtitle {
    margin-top: 15px;
    color: #777;
    max-width: 600px;
    line-height: 1.6;
}

/* TIMER */
.timer {
    margin-top: 30px;
    font-size: 64px;
    letter-spacing: 6px;
}

/* TERMINAL */
.terminal {
    margin-top: 30px;
    height: 260px;
    border: 1px solid #222;
    background: #050505;
    padding: 15px;
    overflow: hidden;
    font-size: 14px;
}

.line {
    opacity: 0;
    animation: fade 0.3s forwards;
}

@keyframes fade {
    to { opacity: 1; }
}

.footer {
    position: absolute;
    bottom: 20px;
    right: 40px;
    color: #333;
    letter-spacing: 10px;
}

/* SVG F-SOCIETY STYLE */
svg {
    filter: invert(1);
}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">

        <!-- SVG F-SOCIETY LOGO (no external image) -->
        <div class="logo">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke="white" stroke-width="2" fill="black"/>
                <circle cx="50" cy="40" r="12" fill="white"/>
                <path d="M30 75 Q50 55 70 75" stroke="white" stroke-width="2" fill="none"/>
            </svg>
        </div>

        <div class="brand">CAMZZZ</div>
        <div class="sub">VOID SYSTEM INTERFACE</div>

        <div class="status">
            <div>● SYSTEM LINK</div>
            <div>● VISUAL CORE</div>
            <div>● TERMINAL ACTIVE</div>
            <div>● SIMULATION MODE</div>
        </div>

    </div>

    <div class="main">

        <div class="title">SYSTEM BREACH</div>

        <div class="subtitle">
            A simulated environment is running diagnostic visualization.
            No real system modification is occurring.
        </div>

        <div class="timer" id="timer">24:00:00</div>

        <div class="terminal" id="terminal"></div>

    </div>

</div>

<div class="footer">CAMZZZ // VOID INTERFACE</div>

<script>

let seconds = 24 * 3600;
const timer = document.getElementById("timer");

function updateTimer() {
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    timer.textContent =
        `${h.toString().padStart(2,'0')}:` +
        `${m.toString().padStart(2,'0')}:` +
        `${s.toString().padStart(2,'0')}`;

    if(seconds > 0) seconds--;
}

setInterval(updateTimer, 1000);

const terminal = document.getElementById("terminal");

const logs = [
    "scanning memory sectors...",
    "render pipeline active...",
    "node synchronization complete...",
    "visual layer injected...",
    "system integrity: unstable...",
    "simulation running in sandbox mode...",
    "UI core loaded...",
];

function addLine() {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = logs[Math.floor(Math.random()*logs.length)];
    terminal.appendChild(div);

    if (terminal.children.length > 15) {
        terminal.removeChild(terminal.firstChild);
    }
}

setInterval(addLine, 200);

</script>

</body>
</html>
